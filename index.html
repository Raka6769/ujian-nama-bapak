
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Ujian Online | CBT</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    #formContainer {
      height: 100vh;
      height: 100dvh;
    }

    #googleFormIframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- HALAMAN AWAL -->
  <div id="startScreen"
       class="max-w-md w-full bg-white p-8 rounded-xl shadow-md text-center">

    <div class="text-4xl mb-4">📝</div>

    <h1 class="text-2xl font-bold text-slate-800 mb-2">
      Ujian Online
    </h1>

    <p class="text-slate-600 mb-6 text-sm leading-relaxed">
      Ujian dilakukan dalam mode fullscreen.
      Jika fullscreen ditutup, halaman ujian akan dikembalikan
      ke halaman awal.
    </p>

    <button id="btnStart"
            type="button"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition">
      Mulai Kerjakan
    </button>

    <p id="statusMessage"
       class="text-sm text-red-600 mt-4 hidden"
       role="status"></p>
  </div>

  <!-- HALAMAN UJIAN -->
  <div id="formContainer"
       class="hidden fixed inset-0 bg-slate-900 flex flex-col w-full z-50">

    <!-- NAVIGASI -->
    <div class="bg-slate-800 text-white px-4 md:px-6 py-3
                flex justify-between items-center shadow
                border-b border-slate-700 shrink-0">

      <div>
        <h2 class="font-semibold text-sm md:text-base">
          Lembar Ujian Google Form
        </h2>
        <p class="text-xs text-slate-400">
          Sistem Ujian Online
        </p>
      </div>

      <span class="bg-green-500/20 text-green-400 text-xs
                   px-3 py-1 rounded-full border border-green-500/30">
        ● Ujian Berlangsung
      </span>
    </div>

    <!-- GOOGLE FORM -->
    <div class="flex-1 w-full bg-white overflow-hidden">
      <iframe
        id="googleFormIframe"
        src="https://docs.google.com/forms/d/e/1FAIpQLSf5-muFHiLqeJxoopJJtRMA12o4HsfZ-iIgv1xnCoPn2mihXA/viewform?embedded=true"
        title="Formulir Ujian Online"
        frameborder="0"
        marginheight="0"
        marginwidth="0">
        Memuat formulir...
      </iframe>
    </div>

  </div>

  <script>
    const startScreen = document.getElementById("startScreen");
    const formContainer = document.getElementById("formContainer");
    const btnStart = document.getElementById("btnStart");
    const statusMessage = document.getElementById("statusMessage");

    let examStarted = false;
    let warningTimer = null;
    let warningShown = false;

    const WARNING_DELAY = 3000;

    // MEMULAI FULLSCREEN
    async function enterFullscreen() {
      try {
        if (document.fullscreenElement) return true;

        if (!document.documentElement.requestFullscreen) {
          return false;
        }

        await document.documentElement.requestFullscreen();

        return Boolean(document.fullscreenElement);
      } catch (error) {
        console.error("Fullscreen gagal:", error);
        return false;
      }
    }

    // PERINGATAN DENGAN JEDA 3 DETIK
    function startWarningTimer(message) {
      if (!examStarted || warningTimer !== null || warningShown) {
        return;
      }

      warningTimer = setTimeout(() => {
        warningTimer = null;

        if (!examStarted) return;

        warningShown = true;
        alert(message);
      }, WARNING_DELAY);
    }

    // MEMBATALKAN TIMER PERINGATAN
    function cancelWarningTimer() {
      if (warningTimer !== null) {
        clearTimeout(warningTimer);
        warningTimer = null;
      }
    }

    // TOMBOL MULAI
    btnStart.addEventListener("click", async () => {
      statusMessage.classList.add("hidden");
      btnStart.disabled = true;
      btnStart.textContent = "Menyiapkan ujian...";

      const success = await enterFullscreen();

      if (!success) {
        statusMessage.textContent =
          "Fullscreen gagal diaktifkan. Coba gunakan Chrome terbaru.";
        statusMessage.classList.remove("hidden");

        btnStart.disabled = false;
        btnStart.textContent = "Coba Lagi";
        return;
      }

      examStarted = true;
      warningShown = false;

      startScreen.classList.add("hidden");
      formContainer.classList.remove("hidden");

      btnStart.disabled = false;
      btnStart.textContent = "Mulai Kerjakan";
    });

    // JIKA FULLSCREEN DITUTUP
    document.addEventListener("fullscreenchange", () => {
      if (examStarted && !document.fullscreenElement) {
        examStarted = false;
        cancelWarningTimer();

        formContainer.classList.add("hidden");
        startScreen.classList.remove("hidden");

        statusMessage.textContent =
          "Fullscreen ditutup. Tekan tombol untuk masuk kembali.";
        statusMessage.classList.remove("hidden");

        btnStart.textContent = "Masuk Fullscreen Kembali";
        warningShown = false;
      }
    });

    // PERUBAHAN UKURAN LAYAR
    // Bisa menjadi indikasi split screen, bukan bukti pasti.
    window.addEventListener("resize", () => {
      if (!examStarted) return;

      startWarningTimer(
        "Perubahan ukuran layar terdeteksi. Pastikan kamu tetap fokus pada ujian."
      );
    });

    // HALAMAN KEHILANGAN FOKUS
    window.addEventListener("blur", () => {
      if (!examStarted) return;

      startWarningTimer(
        "Halaman kehilangan fokus. Silakan kembali fokus pada ujian."
      );
    });

    // HALAMAN MENDAPATKAN FOKUS KEMBALI
    window.addEventListener("focus", () => {
      cancelWarningTimer();
    });

    // HALAMAN TIDAK TERLIHAT
    document.addEventListener("visibilitychange", () => {
      if (!examStarted) return;

      if (document.hidden) {
        startWarningTimer(
          "Halaman ujian tidak terlihat. Silakan kembali ke ujian."
        );
      } else {
        cancelWarningTimer();
      }
    });
  </script>

</body>
</html>
